<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

<title>Pellegrinaggi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link th:href="@{/css/style.css}" rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar}">
</div>


<div class="container">


<h1>
Pellegrinaggi
</h1>


<a href="/pellegrinaggi/nuovo"
class="btn btn-success mb-3">

Nuovo pellegrinaggio

</a>



<table class="table table-striped">


<thead>

<tr>

<th>Nome</th>
<th>Destinazione</th>
<th>Partenza</th>
<th>Costo</th>
<th>Azioni</th>

</tr>

</thead>


<tbody>


<tr th:each="p:${lista}">


<td>
<a th:href="@{/pellegrinaggi/{id}(id=${p.id})}"
th:text="${p.nome}">
</a>
</td>


<td th:text="${p.destinazione}">
</td>


<td th:text="${p.dataPartenza}">
</td>


<td th:text="${p.costo + ' €'}">
</td>



<td>


<a class="btn btn-primary btn-sm"
th:href="@{/pellegrinaggi/modifica/{id}(id=${p.id})}">
Modifica
</a>



<a class="btn btn-danger btn-sm"
th:href="@{/pellegrinaggi/elimina/{id}(id=${p.id})}">
Elimina
</a>


</td>


</tr>


</tbody>


</table>


</div>


</body>

</html>
