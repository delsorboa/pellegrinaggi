<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Scelte</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>

<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">


    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>
                Scelte
            </h2>

            <p class="text-muted mb-0">

                Pellegrinaggio:

                <strong th:text="${pellegrinaggio.nome}">
                </strong>

            </p>

        </div>


        <a class="btn btn-success"
           th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle/{tabellaId}/nuovo(
               pellegrinaggioId=${pellegrinaggio.id},
               tabellaId=${tabella.id}
           )}">

            + Nuova scelta

        </a>

    </div>


    <div th:if="${#lists.isEmpty(scelte)}"
         class="alert alert-info">

        Nessuna scelta inserita.

    </div>


    <div th:unless="${#lists.isEmpty(scelte)}"
         class="table-responsive">

        <table class="table table-striped table-bordered align-middle">

            <thead class="table-dark">

            <tr>

                <th>
                    ID
                </th>

                <th>
                    Descrizione
                </th>

                <th>
                    Azioni
                </th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="scelta : ${scelte}">

                <td th:text="${scelta.id}">
                </td>

                <td th:text="${scelta.descrizione}">
                </td>

                <td>

                    <a class="btn btn-sm btn-warning"
                       th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/scelte/modifica/{id}(
                           pellegrinaggioId=${pellegrinaggio.id},
                           id=${scelta.id}
                       )}">

                        Modifica

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <div class="mt-3">

        <a class="btn btn-secondary"
           th:href="@{/admin/pellegrinaggi/{id}/tabelle(
               id=${pellegrinaggio.id}
           )}">

            ← Torna alle tabelle

        </a>

    </div>


</div>

</body>

</html>
