<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Gestione tabelle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<!-- NAVBAR -->

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>



<div class="container mt-5 pt-4">


    <!-- ===================================================== -->
    <!-- INTESTAZIONE -->
    <!-- ===================================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">


        <div>

            <h2>
                Gestione tabelle
            </h2>


            <p class="text-muted mb-0">

                Pellegrinaggio:

                <strong th:text="${pellegrinaggio.nome}">
                </strong>

            </p>

        </div>


        <!-- NUOVO -->

        <a class="btn btn-success"
           th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle/nuovo(
               pellegrinaggioId=${pellegrinaggio.id}
           )}">

            + Nuovo record

        </a>


    </div>



    <!-- ===================================================== -->
    <!-- MESSAGGIO -->
    <!-- ===================================================== -->

    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}">
    </div>


    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>



    <!-- ===================================================== -->
    <!-- NESSUN RECORD -->
    <!-- ===================================================== -->

    <div th:if="${#lists.isEmpty(tabelle)}"
         class="alert alert-info">

        Nessun record presente per questo pellegrinaggio.

    </div>



    <!-- ===================================================== -->
    <!-- TABELLA -->
    <!-- ===================================================== -->

    <div th:unless="${#lists.isEmpty(tabelle)}"
         class="table-responsive">


        <table class="table table-striped table-bordered align-middle">


            <thead class="table-dark">

            <tr>

                <th style="width: 100px;">
                    ID
                </th>


                <th>
                    Descrizione
                </th>


                <th style="width: 220px;">
                    Azioni
                </th>

            </tr>

            </thead>



            <tbody>


            <tr th:each="tabella : ${tabelle}">


                <!-- ID -->

                <td th:text="${tabella.id}">

                    -

                </td>


                <!-- DESCRIZIONE -->

                <td>

                    <span th:text="${tabella.descrizione}">
                    </span>

                </td>


                <!-- AZIONI -->

                <td>


                    <!-- MODIFICA -->

                    <a class="btn btn-sm btn-warning"
                       th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle/modifica/{id}(
                           pellegrinaggioId=${pellegrinaggio.id},
                           id=${tabella.id}
                       )}">

                        Modifica

                    </a>


                    <!-- ELIMINA -->

                    <form method="post"
                          class="d-inline"
                          th:action="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle/elimina/{id}(
                              pellegrinaggioId=${pellegrinaggio.id},
                              id=${tabella.id}
                          )}"
                          onsubmit="return confirm(
                              'Sei sicuro di voler eliminare questo record?'
                          );">


                        <button type="submit"
                                class="btn btn-sm btn-danger">

                            Elimina

                        </button>


                    </form>


                </td>


            </tr>


            </tbody>


        </table>


    </div>



    <!-- ===================================================== -->
    <!-- INDIETRO -->
    <!-- ===================================================== -->

    <div class="mt-3">


        <a class="btn btn-secondary"
           th:href="@{/admin/pellegrinaggi/{id}/eventi(
               id=${pellegrinaggio.id}
           )}">

            ← Torna agli eventi

        </a>


    </div>


</div>


</body>

</html>
