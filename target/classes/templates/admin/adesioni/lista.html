<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestione adesioni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

<div class="container mt-5 pt-4">

    <div class="d-flex justify-content-between mb-3 align-items-center">
        <h2>Gestione Adesioni</h2>
        <a class="btn btn-primary" th:href="@{/admin/adesioni/nuova}">
            Nuova adesione
        </a>
    </div>

    <!-- FORM DI FILTRAGGIO -->
    <div class="card bg-light mb-4 shadow-sm">
        <div class="card-body">
            <form method="get" th:action="@{/admin/adesioni}" class="row g-3 align-items-end">
                
                <!-- PELLEGRINAGGIO -->
                <div class="col-md-5">
                    <label for="idPellegrinaggio" class="form-label small fw-bold">Pellegrinaggio</label>
                    <select id="idPellegrinaggio" name="idPellegrinaggio" class="form-select">
                        <option value="">Tutti i pellegrinaggi</option>
                        <option th:each="p : ${pellegrinaggi}" 
                                th:value="${p.id}" 
                                th:text="${p.nome}"
                                th:selected="${param.idPellegrinaggio != null and param.idPellegrinaggio[0] == #strings.toString(p.id)}">
                        </option>
                    </select>
                </div>

                <!-- NOME / COGNOME -->
                <div class="col-md-5">
                    <label for="nome" class="form-label small fw-bold">Nome / Cognome</label>
                    <input type="text" id="nome" name="nome" th:value="${param.nome}" class="form-control" placeholder="Inserisci nome o cognome">
                </div>

                <!-- PULSANTI -->
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-dark w-100">Filtra</button>
                    <a th:href="@{/admin/adesioni}" class="btn btn-outline-secondary w-100">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- TABELLA ADESIONI -->
    <table class="table table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>Partecipante</th>
                <th>Codice fiscale</th>
                <th>Pellegrinaggio</th>
                <th>Quota</th>
                <th>Stato</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>
            <!-- Gestione tabella vuota (se non ci sono risultati) -->
            <tr th:if="${#lists.isEmpty(adesioni)}">
                <td colspan="6" class="text-center text-muted py-4">Nessuna adesione trovata con i filtri selezionati.</td>
            </tr>
            
            <!-- Ciclo iterativo sui record della pagina corrente -->
            <tr th:each="a : ${adesioni}">
                <td>
                    <strong th:text="${a.partecipante.nome + ' ' + a.partecipante.cognome}"></strong>
                </td>
                <td th:text="${a.partecipante.codiceFiscale}"></td>
                <td>
                    <span th:text="${a.pellegrinaggio.nome}"></span><br>
                    <small class="text-muted" th:text="${a.pellegrinaggio.destinazione.descrizione}"></small>
                </td>
                <!-- Sostituisci o mappa correttamente con il tuo campo quota reale (es: a.quota o a.prezzo) -->
                <td th:text="${a.quota != null ? '€ ' + a.quota : 'N/D'}"></td>
                <td th:text="${a.stato}"></td>
                <td>
                    <a class="btn btn-warning btn-sm" th:href="@{/admin/adesioni/modifica/{id}(id=${a.id})}">Modifica</a>
                    <a class="btn btn-danger btn-sm" onclick="return confirm('Eliminare adesione?')" th:href="@{/admin/adesioni/elimina/{id}(id=${a.id})}">Elimina</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- COMPONENTE DI PAGINAZIONE BOOTSTRAP -->
    <nav aria-label="Navigazione pagine" th:if="${totalPages > 0}" class="mt-4">
        <ul class="pagination justify-content-center">
            
            <!-- Bottone Precedente -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/admin/adesioni(page=${currentPage - 1}, idPellegrinaggio=${param.idPellegrinaggio}, nome=${param.nome})}">
                    Precedente
                </a>
            </li>

            <!-- Contatore della pagina corrente (es. Pagina 1 di 5) -->
            <li class="page-item disabled">
                <span class="page-link text-dark bg-white fw-medium">
                    Pagina <span th:text="${currentPage + 1}">1</span> di <span th:text="${totalPages}">1</span>
                </span>
            </li>

            <!-- Bottone Successivo -->
            <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/admin/adesioni(page=${currentPage + 1}, idPellegrinaggio=${param.idPellegrinaggio}, nome=${param.nome})}">
                    Successivo
                </a>
            </li>
            
        </ul>
        
        <!-- Contatore del totale degli elementi trovati -->
        <div class="text-center text-muted small mt-2">
            Totale adesioni trovate: <span class="fw-bold" th:text="${totalItems}">0</span>
        </div>
    </nav>

</div>

</body>
</html>
