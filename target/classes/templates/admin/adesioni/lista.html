<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Gestione adesioni</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


<!-- ===================================================== -->
<!-- NAVBAR -->
<!-- ===================================================== -->

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">


    <!-- ===================================================== -->
    <!-- INTESTAZIONE -->
    <!-- ===================================================== -->

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>
            Gestione Adesioni
        </h2>


        <a class="btn btn-success"
           th:href="@{/admin/adesioni/nuova}">

            Nuova adesione

        </a>

    </div>


    <!-- ===================================================== -->
    <!-- FILTRI -->
    <!-- ===================================================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-header bg-primary text-white">

            <strong>
                Filtra adesioni
            </strong>

        </div>


        <div class="card-body">


            <form method="get"
                  th:action="@{/admin/adesioni}">


                <div class="row g-3 align-items-end">


                    <!-- ================================================= -->
                    <!-- PELLEGRINAGGIO -->
                    <!-- ================================================= -->

                    <div class="col-md-5">

                        <label for="idPellegrinaggio"
                               class="form-label">

                            Pellegrinaggio

                        </label>


                        <select id="idPellegrinaggio"
                                name="idPellegrinaggio"
                                class="form-select">


                            <option value="">

                                Tutti i pellegrinaggi

                            </option>


                            <option
                                th:each="p : ${pellegrinaggi}"
                                th:value="${p.id}"
                                th:text="${p.nome}"
                                th:selected="${idPellegrinaggio != null
                                    and idPellegrinaggio == p.id}">

                            </option>


                        </select>

                    </div>


                    <!-- ================================================= -->
                    <!-- NOME / COGNOME -->
                    <!-- ================================================= -->

                    <div class="col-md-5">

                        <label for="nome"
                               class="form-label">

                            Nome / Cognome

                        </label>


                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            class="form-control"
                            placeholder="Inserisci nome o cognome"
                            th:value="${nome}">

                    </div>


                    <!-- ================================================= -->
                    <!-- PULSANTI -->
                    <!-- ================================================= -->

                    <div class="col-md-2">

                        <div class="d-flex gap-2">


                            <button
                                type="submit"
                                class="btn btn-primary">

                                Filtra

                            </button>


                            <a
                                class="btn btn-secondary"
                                th:href="@{/admin/adesioni}">

                                Reset

                            </a>


                        </div>

                    </div>


                </div>


            </form>


        </div>

    </div>


    <!-- ===================================================== -->
    <!-- RISULTATI -->
    <!-- ===================================================== -->

    <div class="card shadow">


        <div class="card-body">


            <!-- ================================================= -->
            <!-- NESSUN RISULTATO -->
            <!-- ================================================= -->

            <div
                th:if="${adesioni.empty}"
                class="alert alert-info mb-0">

                Nessuna adesione trovata
                con i filtri selezionati.

            </div>


            <!-- ================================================= -->
            <!-- TABELLA -->
            <!-- ================================================= -->

            <div
                th:unless="${adesioni.empty}"
                class="table-responsive">


                <table
                    class="table table-striped
                           table-hover
                           align-middle">


                    <thead class="table-primary">

                    <tr>

                        <th>
                            Partecipante
                        </th>

                        <th>
                            Codice fiscale
                        </th>

                        <th>
                            Pellegrinaggio
                        </th>

                        <th>
                            Quota
                        </th>

                        <th>
                            Stato
                        </th>

                        <th>
                            Azioni
                        </th>

                    </tr>

                    </thead>


                    <tbody>


                    <!-- ================================================= -->
                    <!-- RIGHE -->
                    <!-- ================================================= -->

                    <tr th:each="a : ${adesioni.content}">


                        <!-- ================================================= -->
                        <!-- PARTECIPANTE -->
                        <!-- ================================================= -->

                        <td>

                            <strong
                                th:text="${a.partecipante.nome
                                    + ' '
                                    + a.partecipante.cognome}">

                            </strong>

                        </td>


                        <!-- ================================================= -->
                        <!-- CODICE FISCALE -->
                        <!-- ================================================= -->

                        <td
                            th:text="${a.partecipante.codiceFiscale}">

                        </td>


                        <!-- ================================================= -->
                        <!-- PELLEGRINAGGIO -->
                        <!-- ================================================= -->

                        <td>


                            <span
                                th:text="${a.pellegrinaggio.nome}">

                            </span>


                            <br>


                            <small
                                class="text-muted"
                                th:text="${a.pellegrinaggio.destinazione.descrizione}">

                            </small>


                        </td>


                        <!-- ================================================= -->
                        <!-- QUOTA -->
                        <!-- ================================================= -->

                        <td>

                            <span
                                th:text="${a.quota}">

                            </span>

                            €

                        </td>


                        <!-- ================================================= -->
                        <!-- STATO -->
                        <!-- ================================================= -->

                        <td>

                            <span
                                class="badge bg-primary"
                                th:text="${a.stato}">

                            </span>

                        </td>


                        <!-- ================================================= -->
                        <!-- AZIONI -->
                        <!-- ================================================= -->

                        <td>


                            <!-- MODIFICA -->

                            <a
                                class="btn btn-sm btn-warning mb-1"
                                th:href="@{/admin/adesioni/modifica/{id}(
                                    id=${a.id}
                                )}">

                                Modifica

                            </a>


                            <!-- FOGLIO DI SERVIZIO -->

                            <a
                                class="btn btn-sm btn-primary mb-1"
                                th:href="@{/admin/adesioni/{id}/ordine-servizio(
                                    id=${a.id}
                                )}"
                                target="_blank">

                                Foglio di servizio

                            </a>


                            <!-- PAGAMENTI -->

                            <a
                                class="btn btn-sm btn-info mb-1"
                                th:href="@{/admin/pagamenti/adesione/{id}(
                                    id=${a.id}
                                )}">

                                Pagamenti

                            </a>


                        </td>


                    </tr>


                    </tbody>


                </table>


            </div>


            <!-- ===================================================== -->
            <!-- INFORMAZIONI RISULTATI -->
            <!-- ===================================================== -->

            <div
                th:if="${!adesioni.empty}"
                class="text-muted mt-3">

                Visualizzati

                <strong
                    th:text="${adesioni.numberOfElements}">
                </strong>

                risultati su

                <strong
                    th:text="${adesioni.totalElements}">
                </strong>

            </div>


            <!-- ===================================================== -->
            <!-- PAGINAZIONE -->
            <!-- ===================================================== -->

            <nav
                th:if="${adesioni.totalPages > 1}"
                class="mt-4">


                <ul class="pagination justify-content-center">


                    <!-- ================================================= -->
                    <!-- PRIMA PAGINA -->
                    <!-- ================================================= -->

                    <li
                        class="page-item"
                        th:classappend="${adesioni.first ? 'disabled' : ''}">


                        <a
                            class="page-link"
                            th:href="@{/admin/adesioni(
                                page=0,
                                size=${adesioni.size},
                                idPellegrinaggio=${idPellegrinaggio},
                                nome=${nome}
                            )}">

                            «

                        </a>


                    </li>


                    <!-- ================================================= -->
                    <!-- PRECEDENTE -->
                    <!-- ================================================= -->

                    <li
                        class="page-item"
                        th:classappend="${adesioni.first ? 'disabled' : ''}">


                        <a
                            class="page-link"
                            th:href="@{/admin/adesioni(
                                page=${adesioni.number - 1},
                                size=${adesioni.size},
                                idPellegrinaggio=${idPellegrinaggio},
                                nome=${nome}
                            )}">

                            ‹

                        </a>


                    </li>


                    <!-- ================================================= -->
                    <!-- PAGINA CORRENTE -->
                    <!-- ================================================= -->

                    <li class="page-item active">


                        <span class="page-link">

                            Pagina

                            <span
                                th:text="${adesioni.number + 1}">
                            </span>

                            di

                            <span
                                th:text="${adesioni.totalPages}">
                            </span>

                        </span>


                    </li>


                    <!-- ================================================= -->
                    <!-- SUCCESSIVA -->
                    <!-- ================================================= -->

                    <li
                        class="page-item"
                        th:classappend="${adesioni.last ? 'disabled' : ''}">


                        <a
                            class="page-link"
                            th:href="@{/admin/adesioni(
                                page=${adesioni.number + 1},
                                size=${adesioni.size},
                                idPellegrinaggio=${idPellegrinaggio},
                                nome=${nome}
                            )}">

                            ›

                        </a>


                    </li>


                    <!-- ================================================= -->
                    <!-- ULTIMA PAGINA -->
                    <!-- ================================================= -->

                    <li
                        class="page-item"
                        th:classappend="${adesioni.last ? 'disabled' : ''}">


                        <a
                            class="page-link"
                            th:href="@{/admin/adesioni(
                                page=${adesioni.totalPages - 1},
                                size=${adesioni.size},
                                idPellegrinaggio=${idPellegrinaggio},
                                nome=${nome}
                            )}">

                            »

                        </a>


                    </li>


                </ul>


            </nav>


        </div>


    </div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
