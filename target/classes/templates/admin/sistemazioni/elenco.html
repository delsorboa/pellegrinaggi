<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Sistemazioni</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>

<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>
                Sistemazioni
            </h2>

            <p class="text-muted mb-0">
                Pellegrinaggio:
                <strong th:text="${pellegrinaggio.nome}">
                </strong>
            </p>

        </div>


        <a class="btn btn-success"
           th:href="@{/admin/pellegrinaggi/{id}/sistemazioni/nuovo(id=${pellegrinaggio.id})}">

            + Nuova sistemazione

        </a>

    </div>


    <div th:if="${#lists.isEmpty(sistemazioni)}"
         class="alert alert-info">

        Nessuna sistemazione inserita per questo pellegrinaggio.

    </div>


    <div th:unless="${#lists.isEmpty(sistemazioni)}"
         class="table-responsive">

        <table class="table table-striped table-bordered align-middle">

            <thead class="table-dark">

            <tr>

                <th>
                    #
                </th>

                <th>
                    Descrizione
                </th>

                <th style="width: 220px;">
                    Azioni
                </th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="sistemazione, stat : ${sistemazioni}">

                <td th:text="${stat.count}">
                </td>


                <td th:text="${sistemazione.descrizione}">
                </td>


                <td>

                    <a class="btn btn-sm btn-primary"
                       th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/sistemazioni/modifica/{id}
                                (pellegrinaggioId=${pellegrinaggio.id},
                                 id=${sistemazione.id})}">

                        Modifica

                    </a>


                    <a class="btn btn-sm btn-danger"
                       th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/sistemazioni/elimina/{id}
                                (pellegrinaggioId=${pellegrinaggio.id},
                                 id=${sistemazione.id})}"
                       onclick="return confirm('Sei sicuro di voler eliminare questa sistemazione?');">

                        Elimina

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <div class="mt-3">

        <a class="btn btn-secondary"
           th:href="@{/admin/pellegrinaggi/modifica/{id}(id=${pellegrinaggio.id})}">

            ← Torna al pellegrinaggio

        </a>

    </div>


</div>

</body>

</html>
