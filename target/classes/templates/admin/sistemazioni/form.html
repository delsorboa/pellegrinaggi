<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Sistemazione</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">

    <h2 th:if="${sistemazione.id == null}">
        Nuova Sistemazione
    </h2>

    <h2 th:unless="${sistemazione.id == null}">
        Modifica Sistemazione
    </h2>


    <p class="text-muted">

        Pellegrinaggio:

        <strong th:text="${pellegrinaggio.nome}">
        </strong>

    </p>


    <form th:action="@{/admin/pellegrinaggi/sistemazioni/salva}"
          th:object="${sistemazione}"
          method="post">


        <!-- ID della sistemazione -->
        <input type="hidden"
               th:field="*{id}">


        <!-- ID del pellegrinaggio -->
        <input type="hidden"
               name="pellegrinaggioId"
               th:value="${pellegrinaggio.id}">


        <div class="mb-3">

            <label class="form-label">
                Descrizione
            </label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{descrizione}"
                      placeholder="Inserisci la descrizione della sistemazione"
                      required>
            </textarea>

        </div>


        <button type="submit"
                class="btn btn-success">

            Salva

        </button>


        <a class="btn btn-secondary"
           th:href="@{/admin/pellegrinaggi/{id}/sistemazioni(id=${pellegrinaggio.id})}">

            Annulla

        </a>


    </form>

</div>

</body>

</html>
