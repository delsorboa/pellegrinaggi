<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestione Pellegrinaggi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">
      
      
</head>


<body>
	<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>

<div class="container mt-5 pt-4">


    <div class="d-flex justify-content-between mb-3">

        <h2>
            Gestione Pellegrinaggi
        </h2>


        <a class="btn btn-primary"
           th:href="@{/admin/pellegrinaggi/nuovo}">
            Nuovo Pellegrinaggio
        </a>

    </div>



    <table class="table table-striped table-bordered">


        <thead class="table-dark">

        <tr>

            <th>Nome</th>
            <th>Destinazione</th>
            <th>Partenza</th>
            <th>Ritorno</th>
            <th>Costo</th>
            <th>Posti</th>
            <th>Stato</th>
            <th>Azioni</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="p : ${pellegrinaggi}">


            <td th:text="${p.nome}">
            </td>


            <td th:text="${p.destinazione}">
            </td>


            <td th:text="${p.dataPartenza}">
            </td>


            <td th:text="${p.dataRitorno}">
            </td>


            <td>
                € 
                <span th:text="${p.costo}">
                </span>
            </td>


            <td th:text="${p.postiTotali}">
            </td>


            <td th:text="${p.stato}">
            </td>



            <td>


                <a class="btn btn-sm btn-warning"
                   th:href="@{/admin/pellegrinaggi/modifica/{id}(id=${p.id})}">
                    Modifica
                </a>


                <a class="btn btn-sm btn-danger"
                   onclick="return confirm('Eliminare evento?')"
                   th:href="@{/admin/pellegrinaggi/elimina/{id}(id=${p.id})}">
                    Elimina
                </a>


            </td>


        </tr>


        </tbody>


    </table>


</div>


</body>

</html>
