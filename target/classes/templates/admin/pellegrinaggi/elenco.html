<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestione Pellegrinaggi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

<div class="container mt-5 pt-4">

    <!-- INTESTAZIONE -->
    <div class="d-flex justify-content-between mb-3 align-items-center">
        <h2>Gestione Pellegrinaggi</h2>
        <a class="btn btn-primary" th:href="@{/admin/pellegrinaggi/nuovo}">
            Nuovo Pellegrinaggio
        </a>
    </div>

    <!-- FORM DI FILTRAGGIO -->
    <div class="card bg-light mb-4 shadow-sm">
        <div class="card-body">
            <form method="get" th:action="@{/admin/pellegrinaggi}" class="row g-3 align-items-end">
                <div class="col-md-10">
                    <label for="nome" class="form-label small fw-bold">Nome Pellegrinaggio</label>
                    <input type="text" id="nome" name="nome" th:value="${param.nome}" class="form-control" placeholder="Cerca per nome del pellegrinaggio...">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-dark w-100">Filtra</button>
                    <a th:href="@{/admin/pellegrinaggi}" class="btn btn-outline-secondary w-100">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- TABELLA PELLEGRINAGGI -->
    <table class="table table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>Destinazione</th>
                <th>Partenza</th>
                <th>Ritorno</th>
                <th>Costo</th>
                <th>Posti</th>
                <th>Stato</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>
            <!-- Gestione tabella vuota (se non ci sono risultati) -->
            <tr th:if="${#lists.isEmpty(pellegrinaggi)}">
                <td colspan="8" class="text-center text-muted py-4">Nessun pellegrinaggio trovato.</td>
            </tr>
            
            <!-- Ciclo iterativo sui pellegrinaggi della pagina corrente -->
            <tr th:each="p : ${pellegrinaggi}">
                <td th:text="${p.nome}"></td>
                <td th:text="${p.destinazione.descrizione}"></td>
                <td th:text="${p.dataPartenza}"></td>
                <td th:text="${p.dataRitorno}"></td>
                <td>
                    € <span th:text="${p.costo}">0.00</span>
                </td>
                <td th:text="${p.postiTotali}"></td>
                <td th:text="${p.stato}"></td>
                <td>
                    <a class="btn btn-warning btn-sm" th:href="@{/admin/pellegrinaggi/modifica/{id}(id=${p.id})}">Modifica</a>
                    <a class="btn btn-danger btn-sm" onclick="return confirm('Eliminare evento?')" th:href="@{/admin/pellegrinaggi/elimina/{id}(id=${p.id})}">Elimina</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- COMPONENTE DI PAGINAZIONE BOOTSTRAP -->
    <nav aria-label="Navigazione pagine" th:if="${totalPages > 0}" class="mt-4">
        <ul class="pagination justify-content-center">
            
            <!-- Bottone Precedente -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/admin/pellegrinaggi(page=${currentPage - 1}, nome=${param.nome})}">
                    Precedente
                </a>
            </li>

            <!-- Contatore pagina corrente -->
            <li class="page-item disabled">
                <span class="page-link text-dark bg-white fw-medium">
                    Pagina <span th:text="${currentPage + 1}">1</span> di <span th:text="${totalPages}">1</span>
                </span>
            </li>

            <!-- Bottone Successivo -->
            <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/admin/pellegrinaggi(page=${currentPage + 1}, nome=${param.nome})}">
                    Successivo
                </a>
            </li>
            
        </ul>
        
        <!-- Contatore elementi totali -->
        <div class="text-center text-muted small mt-2">
            Totale eventi trovati: <span class="fw-bold" th:text="${totalItems}">0</span>
        </div>
    </nav>

</div>

</body>
</html>
