<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Responsabili spostamento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">


    <!-- TITOLO E PULSANTE AGGIUNGI -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>
                Responsabili dello spostamento
            </h2>

            <p class="text-muted mb-0">

                Spostamento:

                <strong th:text="${spostamento.luogoPartenza}">
                </strong>

                →

                <strong th:text="${spostamento.luogoArrivo}">
                </strong>

            </p>

        </div>


        <a class="btn btn-success"
           th:href="@{/admin/spostamenti/{id}/responsabili/nuovo(id=${spostamento.id})}">

            + Aggiungi responsabile

        </a>

    </div>


    <!-- NESSUN RESPONSABILE -->

    <div th:if="${#lists.isEmpty(responsabili)}"
         class="alert alert-info">

        Nessun responsabile associato a questo spostamento.

    </div>


    <!-- ELENCO RESPONSABILI -->

    <div th:unless="${#lists.isEmpty(responsabili)}"
         class="table-responsive">


        <table class="table table-striped table-bordered align-middle">


            <thead class="table-dark">

            <tr>

                <th>
                    Responsabile
                </th>

                <th style="width: 150px;">
                    Azioni
                </th>

            </tr>

            </thead>


            <tbody>


            <tr th:each="responsabile : ${responsabili}">


                <!-- NOME E COGNOME -->

                <td>

                    <span th:if="${partecipantiMap[responsabile.id.idPartecipante] != null}"
                          th:text="${partecipantiMap[responsabile.id.idPartecipante].nome
                                    + ' '
                                    + partecipantiMap[responsabile.id.idPartecipante].cognome}">
                    </span>


                    <span th:unless="${partecipantiMap[responsabile.id.idPartecipante] != null}"
                          class="text-muted">

                        Partecipante non trovato

                    </span>

                </td>


                <!-- AZIONI -->

                <td>

                    <a class="btn btn-sm btn-danger"
                       th:href="@{/admin/spostamenti/{id}/responsabili/elimina/{partecipante}
                                (id=${spostamento.id},
                                 partecipante=${responsabile.id.idPartecipante})}"
                       onclick="return confirm('Sei sicuro di voler eliminare questo responsabile?');">

                        Elimina

                    </a>

                </td>


            </tr>


            </tbody>

        </table>


    </div>


    <!-- TORNA ALLO SPOSTAMENTO -->

    <div class="mt-3">

       <a class="btn btn-secondary"
		   th:href="@{/admin/pellegrinaggi/{id}/spostamenti(id=${spostamento.pellegrinaggio.id})}">
		
		    ← Torna agli spostamenti
		
		</a>

    </div>


</div>


</body>

</html>
