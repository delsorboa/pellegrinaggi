<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

<div class="container mt-5 pt-4">

    <h2 th:if="${evento.id == null}">
        Nuovo Evento
    </h2>

    <h2 th:unless="${evento.id == null}">
        Modifica Evento
    </h2>

    <form th:action="@{/admin/pellegrinaggi/{id}/eventi/salva(id=${pellegrinaggio.id})}"
          th:object="${evento}"
          method="post">

        <!-- 1. ID (Nascosto) -->
        <input type="hidden" th:field="*{id}">
        
        <!-- ID PELLEGRINAGGIO (Nascosto per non perderlo al salvataggio) -->
        <input type="hidden" th:field="*{idPellegrinaggio}">

        <!-- 2. DESCRIZIONE -->
        <div class="mb-3">
            <label class="form-label">Descrizione</label>
            <textarea class="form-control" rows="4" th:field="*{descrizione}"></textarea>
        </div>
        
        <!-- 6. ID_TIPO_EVENTO (Combo con ID e data-nome aggiunti per JS) -->
        <div class="mb-3">
            <label class="form-label">Tipo evento</label>
            <select class="form-select" id="comboTipoEvento" th:field="*{tipoEvento.id}" required>
                <option value="">-- Seleziona tipo evento --</option>
                <option th:each="tipo : ${tipiEvento}"
                        th:value="${tipo.id}"
                        th:data-nome="${tipo.descrizione.toLowerCase()}"
                        th:text="${tipo.descrizione}">
                </option>
            </select>
        </div>
        
        <!-- 5. ID_TABELLA (Combo con ID aggiunto per JS) -->
        <div class="mb-3">
            <label class="form-label">Tabella</label>
            <select class="form-select" id="comboTabella" th:field="*{tabella.id}" required>
                <option value="">-- Seleziona tabella --</option>
                <option th:each="tabella : ${tabelle}"
                        th:value="${tabella.id}"
                        th:text="${tabella.descrizione}">
                </option>
            </select>
        </div>

        <!-- 4. NOTE -->
        <div class="mb-3">
            <label class="form-label">Note</label>
            <textarea class="form-control" rows="4" th:field="*{note}"></textarea>
        </div>
        
        <!-- 7. ID_EVENTO (Combo - Ricorsiva / Non obbligatoria) -->
        <div class="mb-3">
            <label class="form-label">Evento Correlato (Padre)</label>
            <select class="form-select" th:field="*{eventoPadre.id}">
                <option value="">-- Nessun evento correlato --</option>
                <option th:each="ev : ${tuttiEventi}"
                        th:if="${ev.id != evento.id}"
                        th:value="${ev.id}"
                        th:text="${ev.descrizione}">
                </option>
            </select>
        </div>

        <!-- PULSANTI -->
        <button type="submit" class="btn btn-success">Salva</button>
        <a class="btn btn-secondary" th:href="@{/admin/pellegrinaggi/{id}/eventi(id=${pellegrinaggio.id})}">Annulla</a>

    </form>
</div>

<!-- SCRIPT JAVASCRIPT PER IL FILTRO A CASCATA -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const comboTipoEvento = document.getElementById("comboTipoEvento");
        const comboTabella = document.getElementById("comboTabella");

        // Legge l'array completo inviato da Spring Boot
        const tutteLeTabelle = [[${tabelle}]]; 
        // Identifica il valore pre-selezionato a database in caso di modifica
        const idTabellaIniziale = [[${evento.tabella != null ? evento.tabella.id : null}]];

        function aggiornaComboTabella() {
            const opzioneSelezionata = comboTipoEvento.options[comboTipoEvento.selectedIndex];
            const nomeTipo = opzioneSelezionata ? (opzioneSelezionata.getAttribute("data-nome") || "") : "";

            // Salva temporaneamente il valore selezionato per preservarlo durante il rendering
            const valoreSelezionatoAttuale = comboTabella.value || idTabellaIniziale;

            // Ripristina l'opzione vuota
            comboTabella.innerHTML = '<option value="">-- Seleziona tabella --</option>';

            if (!nomeTipo) return;

            tutteLeTabelle.forEach(function (tabella) {
                const descrizioneTabella = tabella.descrizione.toLowerCase();
                let daAggiungere = false;

                if (nomeTipo.includes("unico")) {
                    if (descrizioneTabella.includes("scelta")) {
                        daAggiungere = true;
                    }
                } else if (nomeTipo.includes("contenitore")) {
                    if (descrizioneTabella.includes("servizi") || descrizioneTabella.includes("partecipante")) {
                        daAggiungere = true;
                    }
                } else {
                    daAggiungere = true;
                }

                if (daAggiungere) {
                    const opt = document.createElement("option");
                    opt.value = tabella.id;
                    opt.text = tabella.descrizione;
                    
                    if (tabella.id == valoreSelezionatoAttuale) {
                        opt.selected = true;
                    }
                    comboTabella.appendChild(opt);
                }
            });
        }

        // Event listener per i cambi di selezione dell'utente
        comboTipoEvento.addEventListener("change", aggiornaComboTabella);

        // Avvio immediato per la gestione corretta della visualizzazione in modifica
        aggiornaComboTabella();
    });
</script>

</body>
</html>
