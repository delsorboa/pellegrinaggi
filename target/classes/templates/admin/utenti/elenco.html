<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Utenti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

<div class="container mt-5 pt-4">

    <!-- INTESTAZIONE -->
    <div class="d-flex justify-content-between mb-3 align-items-center">
        <h2>Gestione utenti</h2>
        <a class="btn btn-primary" th:href="@{/admin/utenti/form}">
            Nuovo Utente
        </a>
    </div>

    <!-- FORM DI FILTRAGGIO -->
    <div class="card bg-light mb-4 shadow-sm">
        <div class="card-body">
            <form method="get" th:action="@{/admin/utenti}" class="row g-3 align-items-end">
                <div class="col-md-10">
                    <label for="username" class="form-label small fw-bold">Username</label>
                    <input type="text" id="username" name="username" th:value="${param.username}" class="form-control" placeholder="Cerca per username...">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-dark w-100">Filtra</button>
                    <a th:href="@{/admin/utenti}" class="btn btn-outline-secondary w-100">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- TABELLA UTENTI -->
    <table class="table table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>Username</th>
                <th>Partecipante</th> <!-- Nuova colonna -->
                <th>Ruolo</th>
                <th>Stato</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>
            <!-- Gestione tabella vuota (se non ci sono risultati) -->
            <tr th:if="${#lists.isEmpty(utenti)}">
                <td colspan="4" class="text-center text-muted py-4">Nessun utente trovato.</td>
            </tr>
            
            <!-- Ciclo iterativo sugli utenti della pagina corrente -->
            <tr th:each="u : ${utenti}">
                <td th:text="${u.username}"></td>
                <!-- Nome e Cognome del Partecipante (Aggiunto qui) -->
                <td>
                    <span th:if="${u.partecipante != null}" 
                          th:text="${u.partecipante.nome + ' ' + u.partecipante.cognome}">
                    </span>
                    <span th:unless="${u.partecipante != null}" class="text-muted small italic">
                        Nessun partecipante
                    </span>
                </td>
                <td th:text="${u.ruolo}"></td>
                <td>
                    <span th:if="${u.attivo}" class="badge bg-success">Attivo</span>
                    <span th:unless="${u.attivo}" class="badge bg-danger">Disattivo</span>
                </td>
                <td>
                    <!-- Modifica password -->
                    <a class="btn btn-warning btn-sm" th:href="@{/admin/utenti/modifica-password/{id}(id=${u.id})}">
                        Modifica password
                    </a>

                    <!-- Disabilita -->
                    <a class="btn btn-danger btn-sm" th:if="${u.attivo}" th:href="@{/admin/utenti/disabilita/{id}(id=${u.id})}">
                        Disabilita
                    </a>

                    <!-- Abilita -->
                    <a class="btn btn-success btn-sm" th:unless="${u.attivo}" th:href="@{/admin/utenti/abilita/{id}(id=${u.id})}">
                        Abilita
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- COMPONENTE DI PAGINAZIONE BOOTSTRAP -->
    <nav aria-label="Navigazione pagine" th:if="${totalPages > 0}" class="mt-4">
        <ul class="pagination justify-content-center">
            
            <!-- Bottone Precedente -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/admin/utenti(page=${currentPage - 1}, username=${param.username})}">
                    Precedente
                </a>
            </li>

            <!-- Contatore pagina corrente -->
            <li class="page-item disabled">
                <span class="page-link text-dark bg-white fw-medium">
                    Pagina <span th:text="${currentPage + 1}">1</span> di <span th:text="${totalPages}">1</span>
                </span>
            </li>

            <!-- Bottone Successivo -->
            <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/admin/utenti(page=${currentPage + 1}, username=${param.username})}">
                    Successivo
                </a>
            </li>
            
        </ul>
        
        <!-- Contatore elementi totali -->
        <div class="text-center text-muted small mt-2">
            Totale utenti trovati: <span class="fw-bold" th:text="${totalItems}">0</span>
        </div>
    </nav>

</div>

</body>
</html>
