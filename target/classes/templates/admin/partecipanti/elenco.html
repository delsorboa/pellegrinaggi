<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partecipanti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

<div class="container mt-5 pt-4">

    <div class="d-flex justify-content-between mb-3 align-items-center">
        <h2>Partecipanti</h2>
        <a class="btn btn-primary" th:href="@{/admin/partecipanti/nuovo}">
            Nuovo partecipante
        </a>
    </div>

    <!-- FORM DI FILTRAGGIO -->
    <div class="card bg-light mb-4 shadow-sm">
        <div class="card-body">
            <form method="get" th:action="@{/admin/partecipanti}" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="nome" class="form-label small fw-bold">Nome</label>
                    <input type="text" id="nome" name="nome" th:value="${param.nome}" class="form-control" placeholder="Cerca per nome...">
                </div>
                <div class="col-md-5">
                    <label for="cognome" class="form-label small fw-bold">Cognome</label>
                    <input type="text" id="cognome" name="cognome" th:value="${param.cognome}" class="form-control" placeholder="Cerca per cognome...">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-dark w-100">Filtra</button>
                    <a th:href="@{/admin/partecipanti}" class="btn btn-outline-secondary w-100">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- TABELLA PARTECIPANTI -->
    <table class="table table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Email</th>
                <th>Telefono</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>
            <!-- Gestione tabella vuota (se non ci sono risultati) -->
            <tr th:if="${#lists.isEmpty(partecipanti)}">
                <td colspan="5" class="text-center text-muted py-4">Nessun partecipante trovato.</td>
            </tr>
            <!-- Ciclo iterativo sui record della pagina corrente -->
            <tr th:each="p : ${partecipanti}">
                <td th:text="${p.nome}"></td>
                <td th:text="${p.cognome}"></td>
                <td th:text="${p.email}"></td>
                <td th:text="${p.telefono}"></td>
                <td>
                    <a class="btn btn-warning btn-sm" th:href="@{/admin/partecipanti/modifica/{id}(id=${p.id})}">Modifica</a>
                    <a class="btn btn-danger btn-sm" onclick="return confirm('Eliminare partecipante?')" th:href="@{/admin/partecipanti/elimina/{id}(id=${p.id})}">Elimina</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- COMPONENTE DI PAGINAZIONE BOOTSTRAP (Aggiunto qui sotto la tabella) -->
    <nav aria-label="Navigazione pagine" th:if="${totalPages > 0}" class="mt-4">
        <ul class="pagination justify-content-center">
            
            <!-- Bottone Precedente -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/admin/partecipanti(page=${currentPage - 1}, nome=${param.nome}, cognome=${param.cognome})}">
                    Precedente
                </a>
            </li>

            <!-- Contatore della pagina corrente (es. Pagina 1 di 5) -->
            <li class="page-item disabled">
                <span class="page-link text-dark bg-white fw-medium">
                    Pagina <span th:text="${currentPage + 1}">1</span> di <span th:text="${totalPages}">1</span>
                </span>
            </li>

            <!-- Bottone Successivo -->
            <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/admin/partecipanti(page=${currentPage + 1}, nome=${param.nome}, cognome=${param.cognome})}">
                    Successivo
                </a>
            </li>
            
        </ul>
        
        <!-- Contatore del totale degli elementi trovati -->
        <div class="text-center text-muted small mt-2">
            Totale iscritti trovati: <span class="fw-bold" th:text="${totalItems}">0</span>
        </div>
    </nav>

</div>

</body>
</html>
</html>
