<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Partecipanti</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
     
<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>



<div class="container mt-5 pt-4">


<div class="d-flex justify-content-between mb-3">


<h2>
Partecipanti
</h2>


<a class="btn btn-primary"
   th:href="@{/admin/partecipanti/nuovo}">
Nuovo partecipante
</a>


</div>



<table class="table table-striped">


<thead class="table-dark">

<tr>

<th>Nome</th>
<th>Cognome</th>
<th>Email</th>
<th>Telefono</th>
<th>Azioni</th>

</tr>

</thead>



<tbody>


<tr th:each="p : ${partecipanti}">


<td th:text="${p.nome}">
</td>


<td th:text="${p.cognome}">
</td>


<td th:text="${p.email}">
</td>


<td th:text="${p.telefono}">
</td>



<td>


<a class="btn btn-warning btn-sm"
th:href="@{/admin/partecipanti/modifica/{id}(id=${p.id})}">
Modifica
</a>



<a class="btn btn-danger btn-sm"
onclick="return confirm('Eliminare partecipante?')"
th:href="@{/admin/partecipanti/elimina/{id}(id=${p.id})}">
Elimina
</a>


</td>


</tr>


</tbody>


</table>


</div>


</body>

</html>
