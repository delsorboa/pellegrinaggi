<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuovo Partecipante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>
                Nuovo partecipante
            </h3>

        </div>


        <div class="card-body">

            <form th:action="@{/admin/partecipanti/salva}"
                  th:object="${partecipante}"
                  method="post">

                 <input type="hidden" th:field="*{id}">

                <!-- ID PELLEGRINAGGIO -->
                <input type="hidden"
                       name="pellegrinaggioId"
                       th:value="${pellegrinaggioId}">


                <!-- GRADO E QUALIFICA -->
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Grado
                        </label>

                        <select class="form-select"
                                th:field="*{idGrado}">

                            <option value="">
                                -- Seleziona grado --
                            </option>

                            <option th:each="grado : ${gradi}"
                                    th:value="${grado.id}"
                                    th:text="${grado.descrizione}">
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Qualifica
                        </label>

                        <select class="form-select"
                                th:field="*{idQualifica}">

                            <option value="">
                                -- Seleziona qualifica --
                            </option>

                            <option th:each="qualifica : ${qualifiche}"
                                    th:value="${qualifica.id}"
                                    th:text="${qualifica.descrizione}">
                            </option>

                        </select>

                    </div>

                </div>


                <!-- NOME E COGNOME -->
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Nome
                        </label>

                        <input class="form-control"
                               th:field="*{nome}"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Cognome
                        </label>

                        <input class="form-control"
                               th:field="*{cognome}"
                               required>

                    </div>

                </div>


                <!-- DATA NASCITA, TELEFONO, EMAIL -->
                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Data nascita
                        </label>

                        <input type="date"
                               class="form-control"
                               th:field="*{dataNascita}">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Telefono
                        </label>

                        <input class="form-control"
                               th:field="*{telefono}">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}">

                    </div>

                </div>


                <!-- CODICE FISCALE -->
                <div class="mb-3">

                    <label class="form-label">
                        Codice fiscale
                    </label>

                    <input class="form-control"
                           th:field="*{codiceFiscale}"
                           id="codiceFiscale"
                           maxlength="16"
                           pattern="[A-Za-z0-9]{16}"
                           title="Il codice fiscale deve essere composto da 16 caratteri alfanumerici"
                           style="text-transform: uppercase"
                           required>

                </div>


                <!-- INDIRIZZO -->
                <div class="mb-3">

                    <label class="form-label">
                        Indirizzo
                    </label>

                    <input class="form-control"
                           th:field="*{indirizzo}">

                </div>


                <!-- CITTÀ E CAP -->
                <div class="row">

                    <div class="col-md-8 mb-3">

                        <label class="form-label">
                            Città
                        </label>

                        <input class="form-control"
                               th:field="*{citta}">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            CAP
                        </label>

                        <input class="form-control"
                               th:field="*{cap}">

                    </div>

                </div>


                <hr>


                <!-- PULSANTI -->
                <button type="submit"
                        class="btn btn-success">
                    Salva Partecipante
                </button>


                <a class="btn btn-secondary"
   					th:href="@{/admin/partecipanti}">
    					Annulla
				</a>


            </form>

        </div>

    </div>

</div>


</body>

</html>
