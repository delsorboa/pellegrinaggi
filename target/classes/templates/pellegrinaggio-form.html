<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

<title>Pellegrinaggio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link th:href="@{/css/style.css}" rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar}">
</div>


<div class="container">


<div class="card">

<div class="card-header">
Pellegrinaggio
</div>


<div class="card-body">


<form method="post"
action="/pellegrinaggi/salva"
th:object="${pellegrinaggio}">


<input type="hidden"
th:field="*{id}">


<div class="mb-3">

<label>Nome</label>

<input class="form-control"
th:field="*{nome}">

</div>



<div class="mb-3">

<label>Destinazione</label>

<input class="form-control"
th:field="*{destinazione}">

</div>



<div class="mb-3">

<label>Data partenza</label>

<input type="date"
class="form-control"
th:field="*{dataPartenza}">

</div>



<div class="mb-3">

<label>Costo</label>

<input class="form-control"
th:field="*{costo}">

</div>



<button class="btn btn-success">

Salva

</button>


</form>


</div>

</div>


</div>

</body>

</html>
