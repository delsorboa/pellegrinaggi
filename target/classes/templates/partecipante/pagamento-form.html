<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>
Segnala pagamento
</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar-partecipante :: navbar-partecipante}">
</div>


<div class="container mt-5 pt-4">


<div class="card shadow">


<div class="card-header bg-success text-white">

<h3>
Segnala pagamento
</h3>

</div>


<div class="card-body">


<p>

Pellegrinaggio:

<b th:text="${adesione.pellegrinaggio.nome}">
</b>

</p>



<form th:action="@{/partecipante/pagamenti/salva}"
      th:object="${pagamento}"
      method="post">


<input type="hidden"
       th:field="*{adesione.id}">



<div class="mb-3">

<label>
Importo
</label>

<input type="number"
       step="0.01"
       min="0"
       class="form-control"
       th:field="*{importo}"
       required>

</div>



<div class="mb-3">

<label>
Tipo pagamento
</label>

<select class="form-select"
        th:field="*{tipoPagamento}">

<option value="ANTICIPO">
Anticipo
</option>

<option value="SALDO">
Saldo
</option>

</select>

</div>



<div class="mb-3">

<label>
Causale
</label>

<input class="form-control"
       th:field="*{causale}">

</div>



<div class="mb-3">

<label>
Note
</label>

<textarea class="form-control"
          th:field="*{note}">
</textarea>

</div>



<button class="btn btn-success">
Invia segnalazione
</button>


<a class="btn btn-secondary"
   th:href="@{/partecipante}">
Annulla
</a>


</form>


</div>

</div>


</div>


</body>

</html>
