<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<title>
Area partecipante
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">


</head>


<body>


<nav class="navbar navbar-dark bg-success fixed-top">

<div class="container-fluid">


<span class="navbar-brand">
Area partecipante
</span>


<form th:action="@{/logout}" method="post">

<button class="btn btn-light btn-sm">
Logout
</button>

</form>


</div>

</nav>



<div class="container mt-5 pt-4">



<h3>

Benvenuto

<span th:text="${partecipante.nome}">
</span>

<span th:text="${partecipante.cognome}">
</span>

</h3>



<hr>



<h4>
Pellegrinaggi disponibili
</h4>



<div class="row">


<div class="col-md-4 mb-3"
     th:each="p:${pellegrinaggi}">



<div class="card shadow">


<div class="card-body">


<h5 th:text="${p.nome}">
</h5>


<p>
Destinazione:
<span th:text="${p.destinazione}">
</span>
</p>


<p>
Partenza:
<span th:text="${p.dataPartenza}">
</span>
</p>

<p>
Posti totali:
<span th:text="${p.postiTotali}">
</span>
</p>


<p>
Posti Liberi:
<span th:text="${p.postiLiberi}">
</span>
</p>



<div class="d-flex gap-2">

<a class="btn btn-success"
th:href="@{/partecipante/adesione/{id}(id=${p.id})}">
Aderisci
</a>


<a class="btn btn-primary"
th:href="@{/partecipante/familiare/nuovo/{id}(id=${p.id})}">
Aggiungi familiare
</a>

</div>

</div>


</div>


</div>


</div>




<hr class="mt-5">



<h4>
Le mie adesioni
</h4>



<table class="table table-striped">


<thead class="table-dark">

<tr>

<th>Partecipante</th>
<th>Pellegrinaggio</th>
<th>Destinazione</th>
<th>Data</th>
<th>Azioni</th>

</tr>

</thead>


<tbody>


<tr th:each="a:${adesioni}">


<td>

<span th:text="${a.partecipante.nome}">
</span>

<span th:text="${a.partecipante.cognome}">
</span>

</td>


<td th:text="${a.pellegrinaggio.nome}">
</td>


<td th:text="${a.pellegrinaggio.destinazione}">
</td>


<td th:text="${a.pellegrinaggio.dataPartenza}">
</td>

<td>

<a class="btn btn-success btn-sm"
   th:href="@{/partecipante/pagamenti/{id}(id=${a.id})}">

    Pagamenti

</a>

</td>


</tr>


</tbody>

</table>



</div>


</body>

</html>
