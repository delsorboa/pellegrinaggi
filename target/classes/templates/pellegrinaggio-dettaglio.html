<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

<title>Dettaglio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link th:href="@{/css/style.css}" rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar}">
</div>


<div class="container">


<div class="card">


<div class="card-header">

Dettaglio pellegrinaggio

</div>


<div class="card-body">


<h2 th:text="${pellegrinaggio.nome}">
</h2>


<p>
<strong>Destinazione:</strong>

<span th:text="${pellegrinaggio.destinazione}">
</span>

</p>


<p>
<strong>Partenza:</strong>

<span th:text="${pellegrinaggio.dataPartenza}">
</span>

</p>


<p>
<strong>Costo:</strong>

<span th:text="${pellegrinaggio.costo + ' €'}">
</span>

</p>

<hr>

<h3>
Partecipanti iscritti
</h3>


<a class="btn btn-success mb-3"
th:href="@{/adesioni/nuova/{id}(id=${pellegrinaggio.id})}">

+ Aggiungi partecipante

</a>

<a class="btn btn-secondary"
th:href="@{/report/partecipanti/{id}(id=${pellegrinaggio.id})}">

📄 Stampa partecipanti

</a>

<a class="btn btn-warning"
th:href="@{/report/economico/{id}(id=${pellegrinaggio.id})}">

📊 Situazione economica

</a>


<table class="table">


<thead>

<tr>

<th>Nome</th>
<th>Cognome</th>
<th>Stato</th>
<th></th>

</tr>

</thead>


<tbody>


<tr th:each="a:${pellegrinaggio.adesioni}">


<td th:text="${a.partecipante.nome}">
</td>


<td th:text="${a.partecipante.cognome}">
</td>


<td th:text="${a.stato}">
</td>


<td>

<a class="btn btn-danger btn-sm"
th:href="@{/adesioni/elimina/{id}(id=${a.id})}">

Rimuovi

</a>

</td>


</tr>


</tbody>

</table>


</div>


</div>


</div>


</body>

</html>
