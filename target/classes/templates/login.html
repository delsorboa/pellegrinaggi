<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-card {
            max-width: 400px;
            border: 2px solid #dc3545;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            background-color: #dc3545;
            color: white;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 10px auto 20px auto;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #bb2d3b;
            border-color: #b02a37;
        }

        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card mx-auto login-card">

        <div class="card-header">
            Accesso Gestionale
        </div>

        <div class="card-body">

            <img th:src="@{/images/scudo.jpg}"
                 src="/images/scudo.jpg"
                 alt="Logo"
                 class="logo">

            <form method="post" action="/login">

                <input class="form-control mb-3"
                       name="username"
                       placeholder="Username">

                <input class="form-control mb-3"
                       type="password"
                       name="password"
                       placeholder="Password">

                <button type="submit" class="btn btn-danger w-100">
                    Entra
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
