<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

<title>Nuova adesione</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link th:href="@{/css/style.css}" rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar}">
</div>


<div class="container">


<div class="card">


<div class="card-header">

Aggiungi partecipante

</div>


<div class="card-body">


<form method="post"
action="/adesioni/salva">


<input type="hidden"
name="pellegrinaggioId"
th:value="${adesione.pellegrinaggio.id}">



<label>
Partecipante
</label>


<select class="form-control"
name="partecipanteId">


<option th:each="p:${partecipanti}"
th:value="${p.id}"
th:text="${p.nome+' '+p.cognome}">

</option>


</select>



<br>


<label>
Stato
</label>


<select class="form-control"
name="stato">


<option th:each="s:${stati}"
th:value="${s}"
th:text="${s}">
</option>


</select>



<br>


<button class="btn btn-success">

Salva adesione

</button>


</form>


</div>

</div>


</div>


</body>

</html>
