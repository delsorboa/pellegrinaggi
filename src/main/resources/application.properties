# Porta dinamica per il Cloud (usa la 8080 in locale)
server.port=${PORT:8080}

# CONFIGURAZIONE DINAMICA PER VARIABILI NATIVE PANDASTACK
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configurazione Hibernate per PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Configurazione Thymeleaf
spring.thymeleaf.cache=false

# Dice a Spring Boot di usare l'host e il protocollo (HTTPS) inviati dal cloud
server.forward-headers-strategy=framework





