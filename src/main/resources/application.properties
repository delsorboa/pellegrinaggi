# Mantiene la porta richiesta dal Cloud
server.port=${PORT:8080}

# Configurazione DINAMICA tramite le variabili d'ambiente ufficiali di PandaStack
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configurazione Hibernate per PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Configurazione Thymeleaf
spring.thymeleaf.cache=false


