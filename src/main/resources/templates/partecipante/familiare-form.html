<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Nuovo Familiare</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
      
<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-partecipante :: navbar-partecipante}">
</div>


<div class="container mt-5 pt-4">


<div class="card shadow">


<div class="card-header bg-primary text-white">

<h3>
Nuovo partecipante
</h3>

</div>



<div class="card-body">


<form th:action="@{/partecipante/familiare/salva}"
      th:object="${partecipante}"
      method="post">



<input type="hidden"
       name="pellegrinaggioId"
       th:value="${pellegrinaggioId}">



<div class="row">


<div class="col-md-6 mb-3">

<label class="form-label">
Nome
</label>

<input class="form-control"
       th:field="*{nome}"
       required>

</div>



<div class="col-md-6 mb-3">

<label class="form-label">
Cognome
</label>

<input class="form-control"
       th:field="*{cognome}"
       required>

</div>


</div>





<div class="row">


<div class="col-md-4 mb-3">

<label class="form-label">
Data nascita
</label>


<input type="date"
       class="form-control"
       th:field="*{dataNascita}">

</div>



<div class="col-md-4 mb-3">

<label class="form-label">
Telefono
</label>


<input class="form-control"
       th:field="*{telefono}">

</div>



<div class="col-md-4 mb-3">

<label class="form-label">
Email
</label>


<input type="email"
       class="form-control"
       th:field="*{email}">

</div>


</div>





<div class="mb-3">

<label class="form-label">
Codice fiscale
</label>


<input class="form-control"
       th:field="*{codiceFiscale}"
       id="codiceFiscale"
       maxlength="16"
       pattern="[A-Za-z0-9]{16}"
       title="Il codice fiscale deve essere composto da 16 caratteri alfanumerici"
       style="text-transform:uppercase"
       required>

</div>





<div class="mb-3">

<label class="form-label">
Indirizzo
</label>


<input class="form-control"
       th:field="*{indirizzo}">

</div>





<div class="row">


<div class="col-md-8 mb-3">

<label class="form-label">
Città
</label>


<input class="form-control"
       th:field="*{citta}">

</div>



<div class="col-md-4 mb-3">

<label class="form-label">
CAP
</label>


<input class="form-control"
       th:field="*{cap}">

</div>


</div>




<hr>



<button class="btn btn-success">
Salva Familiare
</button>



<a class="btn btn-secondary"
   th:href="@{/partecipante}">
   Annulla
</a>



</form>


</div>


</div>


</div>


</body>

</html>
