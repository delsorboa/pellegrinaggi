<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Pagamenti</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar-partecipante :: navbar-partecipante}">
</div>



<div class="container mt-5 pt-4">


<h3>
Pagamenti adesione
</h3>

<a class="btn btn-success mb-3"
   th:href="@{/partecipante/pagamenti/nuovo/{id}(id=${adesione.id})}">

Inserisci pagamento

</a>


<h5>

<span th:text="${adesione.partecipante.nome}">
</span>

<span th:text="${adesione.partecipante.cognome}">
</span>

-

<span th:text="${adesione.pellegrinaggio.nome}">
</span>

</h5>



<table class="table table-striped mt-4">


<thead class="table-dark">

<tr>

<th>Data</th>
<th>Importo</th>
<th>Tipo</th>
<th>Causale</th>

</tr>

</thead>


<tbody>


<tr th:each="p:${pagamenti}">


<td th:text="${p.dataPagamento}">
</td>


<td th:text="${p.importo}">
</td>


<td th:text="${p.tipoPagamento}">
</td>


<td th:text="${p.causale}">
</td>


</tr>


</tbody>

</table>


</div>


</body>

</html>
