<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

<title>Pagamento</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link th:href="@{/css/style.css}" rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar}"></div>


<div class="container">


<div class="card">

<div class="card-header">
Inserimento pagamento
</div>


<div class="card-body">


<form method="post"
action="/pagamenti/salva"
th:object="${pagamento}">


<input type="hidden"
name="adesione"
th:value="${pagamento.adesione.id}">


<label>Importo</label>

<input class="form-control"
th:field="*{importo}">


<br>


<label>Causale</label>

<input class="form-control"
th:field="*{causale}">


<br>


<button class="btn btn-success">
Salva
</button>


</form>


</div>

</div>


</div>


</body>

</html>
