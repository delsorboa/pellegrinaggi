<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Eventi partecipante</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
        
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-4 pt-4">


    <!-- ===================================================== -->
    <!-- TITOLO -->
    <!-- ===================================================== -->

    <div class="mb-4">

        <h2>
            Eventi del partecipante
        </h2>

        <p class="text-muted mb-0">

            <strong
                th:text="${adesione.partecipante.cognome
                    + ' '
                    + adesione.partecipante.nome}">
            </strong>

            <span class="mx-2">·</span>

            Pellegrinaggio:

            <strong
                th:text="${adesione.pellegrinaggio.nome}">
            </strong>

        </p>

    </div>


    <!-- ===================================================== -->
    <!-- MESSAGGIO -->
    <!-- ===================================================== -->

    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}">
    </div>


    <!-- ===================================================== -->
    <!-- EVENTI DISPONIBILI -->
    <!-- ===================================================== -->

    <div class="card mb-4">


        <div class="card-header bg-success text-white">

            <strong>
                Eventi disponibili
            </strong>

        </div>


        <div class="card-body p-0">


            <div th:if="${#lists.isEmpty(eventiDisponibili)}"
                 class="alert alert-info m-3">

                Non ci sono altri eventi disponibili
                per questo partecipante.

            </div>


            <div th:unless="${#lists.isEmpty(eventiDisponibili)}"
                 class="table-responsive">


                <table class="table table-striped
                              table-bordered
                              align-middle
                              mb-0">


                    <thead class="table-dark">

                    <tr>

                        <th>
                            Evento
                        </th>

                        <th style="width: 220px;">
                            Ruolo
                        </th>

                        <th style="width: 300px;">
                            Valore
                        </th>

                        <th style="width: 120px;">
                            Azione
                        </th>

                    </tr>

                    </thead>


                    <tbody>


                    <tr th:each="evento : ${eventiDisponibili}">


                        <!-- ================================================= -->
                        <!-- FORM INVISIBILE ASSOCIATO ALLA RIGA -->
                        <!-- ================================================= -->

                        <form
                            th:id="'form-evento-' + ${evento.id}"
                            method="post"
                            th:action="@{/admin/adesioni/{id}/eventi/salva(
                                id=${adesione.id}
                            )}">
                        </form>


                        <!-- ================================================= -->
                        <!-- EVENTO -->
                        <!-- ================================================= -->

                        <td>

                            <strong
                                th:text="${evento.descrizione}">
                            </strong>


                            <!-- ID EVENTO -->

                            <input
                                type="hidden"
                                name="idEvento"
                                th:value="${evento.id}"
                                th:form="'form-evento-' + ${evento.id}">


                            <!-- ID TABELLA -->

                            <input
                                type="hidden"
                                name="idTabella"
                                th:value="${evento.tabella != null
                                    ? evento.tabella.id
                                    : ''}"
                                th:form="'form-evento-' + ${evento.id}">

                        </td>


                        <!-- ================================================= -->
                        <!-- RUOLO -->
                        <!-- ================================================= -->

                        <td>

                            <select
                                name="idRuolo"
                                class="form-select"
                                required
                                th:form="'form-evento-' + ${evento.id}">

                                <option value="">

                                    -- Seleziona ruolo --

                                </option>


                                <option
                                    th:each="ruolo : ${ruoli}"
                                    th:value="${ruolo.id}"
                                    th:text="${ruolo.descrizione}">

                                </option>

                            </select>

                        </td>


                        <!-- ================================================= -->
                        <!-- VALORE -->
                        <!-- ================================================= -->

                        <td>
							
							  <!-- ============================================= -->
                            <!-- TABELLA 1 = SCELTA -->
                            <!-- ============================================= -->
                            
                            
                            <input
                                type="hidden"
                                name="idValoreTabella"
                                th:value="1"
                                th:form="'form-evento-' + ${evento.id}">


                            <!-- ============================================= -->
                            <!-- TABELLA 2 = SERVIZI -->
                            <!-- ============================================= -->

                            <select
                                th:if="${evento.tabella != null
                                        and evento.tabella.id == 2}"
                                name="idValoreTabella"
                                class="form-select"
                                required
                                th:form="'form-evento-' + ${evento.id}">


                                <option value="">

                                    -- Seleziona servizio --

                                </option>


                                <option
                                    th:each="servizio : ${valoriTabellaServizi}"
                                    th:value="${servizio.id}"
                                    th:text="${servizio.descrizione}">

                                </option>

                            </select>


                            <!-- ============================================= -->
                            <!-- TABELLA 3 = PARTECIPANTE -->
                            <!-- ============================================= -->

                            <select
                                th:if="${evento.tabella != null
                                        and evento.tabella.id == 3}"
                                name="idValoreTabella"
                                class="form-select"
                                required
                                th:form="'form-evento-' + ${evento.id}">


                                <option value="">

                                    -- Seleziona partecipante --

                                </option>


                                <option
                                    th:each="partecipante : ${valoriTabellaPartecipanti}"
                                    th:value="${partecipante.id}"
                                    th:text="${partecipante.descrizione}">

                                </option>

                            </select>


                            <!-- ============================================= -->
                            <!-- NESSUNA TABELLA -->
                            <!-- ============================================= -->

                            <input
                                th:if="${evento.tabella == null}"
                                type="hidden"
                                name="idValoreTabella"
                                value=""
                                th:form="'form-evento-' + ${evento.id}">


                            <span
                                th:if="${evento.tabella == null}"
                                class="text-muted">

                                Nessun valore richiesto

                            </span>

                        </td>


                        <!-- ================================================= -->
                        <!-- AZIONE -->
                        <!-- ================================================= -->

                        <td>

                            <button
                                type="submit"
                                class="btn btn-sm btn-success"
                                th:form="'form-evento-' + ${evento.id}">

                                Abbina

                            </button>

                        </td>


                    </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- EVENTI GIÀ ASSOCIATI -->
    <!-- ===================================================== -->

    <div class="card mb-4">


        <div class="card-header bg-dark text-white">

            <strong>
                Eventi associati
            </strong>

        </div>


        <div class="card-body p-0">


            <div th:if="${#lists.isEmpty(eventi)}"
                 class="alert alert-info m-3">

                Nessun evento associato
                a questo partecipante.

            </div>


            <div th:unless="${#lists.isEmpty(eventi)}"
                 class="table-responsive">


                <table class="table table-striped
                              table-bordered
                              table-hover
                              align-middle
                              mb-0">


                    <thead class="table-dark">

                    <tr>

                        <th>
                            Evento
                        </th>

                        <th>
                            Ruolo
                        </th>

                        <th>
                            Valore
                        </th>

                        <th style="width: 150px;">
                            Azioni
                        </th>

                    </tr>

                    </thead>


                    <tbody>


                    <tr th:each="evento : ${eventi}">


                        <!-- ========================================= -->
                        <!-- EVENTO -->
                        <!-- ========================================= -->

                        <td
                            th:text="${evento.descrizioneEvento}">
                        </td>


                        <!-- ========================================= -->
                        <!-- RUOLO -->
                        <!-- ========================================= -->

                        <td
                            th:text="${evento.descrizioneRuolo}">
                        </td>


                        <!-- ========================================= -->
                        <!-- VALORE -->
                        <!-- ========================================= -->

                        <td>

                            <span
                                th:if="${evento.descrizioneValore != null}"
                                th:text="${evento.descrizioneValore}">
                            </span>


                            <span
                                th:if="${evento.descrizioneValore == null}"
                                class="text-muted">

                                -

                            </span>

                        </td>


                        <!-- ========================================= -->
                        <!-- AZIONI -->
                        <!-- ========================================= -->

                        <td>

                            <a
                                class="btn btn-sm btn-danger"
                                th:href="@{/admin/adesioni/{id}/eventi/elimina/{idEvento}(
                                    id=${adesione.id},
                                    idEvento=${evento.id}
                                )}"
                                onclick="return confirm(
                                    'Vuoi eliminare questo evento?'
                                );">

                                Elimina

                            </a>

                        </td>


                    </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- INDIETRO -->
    <!-- ===================================================== -->

    <div class="mt-3">

        <a
            class="btn btn-secondary"
            th:href="@{/admin/adesioni}">

            ← Torna alle adesioni

        </a>

    </div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
