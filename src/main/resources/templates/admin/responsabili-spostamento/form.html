<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Aggiungi responsabile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">


    <h2>
        Aggiungi responsabile
    </h2>


    <p class="text-muted">

        Spostamento:

        <strong th:text="${spostamento.luogoPartenza}">
        </strong>

        →

        <strong th:text="${spostamento.luogoArrivo}">
        </strong>

    </p>


    <form th:action="@{/admin/spostamenti/{id}/responsabili/salva(id=${spostamento.id})}"
          method="post">


        <div class="mb-3">

            <label class="form-label">
                Partecipante
            </label>


            <select class="form-select"
                    name="idPartecipante"
                    required>

                <option value="">
                    -- Seleziona partecipante --
                </option>


                <option th:each="p : ${partecipanti}"
                        th:value="${p.id}"
                        th:text="${p.nome + ' ' + p.cognome}">
                </option>

            </select>

        </div>


        <button type="submit"
                class="btn btn-success">

            Aggiungi

        </button>


        <a class="btn btn-secondary"
           th:href="@{/admin/spostamenti/{id}/responsabili(id=${spostamento.id})}">

            Annulla

        </a>


    </form>


</div>

</body>

</html>
