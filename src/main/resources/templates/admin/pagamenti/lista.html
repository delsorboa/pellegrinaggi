<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Pagamenti</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">


<h3>
Pagamenti adesione
</h3>


<h5>

<span th:text="${adesione.partecipante.nome}">
</span>

<span th:text="${adesione.partecipante.cognome}">
</span>

-

<span th:text="${adesione.pellegrinaggio.nome}">
</span>

</h5>

<div class="row mb-4">


<div class="col-md-3">

<div class="card shadow">

<div class="card-body">

<h6>
Quota
</h6>

<h4>
<span th:text="${quota}">
</span>
€
</h4>

</div>

</div>

</div>




<div class="col-md-3">

<div class="card shadow">

<div class="card-body">

<h6>
Pagato
</h6>

<h4 class="text-success">

<span th:text="${totalePagato}">
</span>
€

</h4>

</div>

</div>

</div>




<div class="col-md-3">

<div class="card shadow">

<div class="card-body">

<h6>
Residuo
</h6>

<h4 class="text-danger">

<span th:text="${residuo}">
</span>
€

</h4>

</div>

</div>

</div>




<div class="col-md-3">

<div class="card shadow">

<div class="card-body">

<h6>
Stato
</h6>


<h4>

<span class="badge bg-primary"
      th:text="${statoPagamento}">
</span>

</h4>


</div>

</div>

</div>


</div>

<a class="btn btn-success mb-3"
th:href="@{/admin/pagamenti/nuovo/{id}(id=${adesione.id})}">

Nuovo pagamento

</a>



<table class="table table-striped">


<thead>

<tr>

<th>Tipo</th>
<th>Importo</th>
<th>Data</th>
<th>Causale</th>
<th>Stato</th>
<th>Azioni</th>

</tr>

</thead>


<tbody>


<tr th:each="p:${pagamenti}">


<td th:text="${p.tipoPagamento}">
</td>


<td th:text="${p.importo}">
</td>


<td th:text="${p.dataPagamento}">
</td>


<td th:text="${p.causale}">
</td>

<td>

<span class="badge bg-secondary"
      th:text="${p.statoPagamento}">
</span>

</td>

<td>


<form th:if="${p.statoPagamento == 'INSERITO'}"
      th:action="@{/admin/pagamenti/conferma/{id}(id=${p.id})}"
      method="post"
      style="display:inline">


<button class="btn btn-success btn-sm">

Conferma

</button>


</form>



<form th:if="${p.statoPagamento == 'INSERITO'}"
      th:action="@{/admin/pagamenti/rifiuta/{id}(id=${p.id})}"
      method="post"
      style="display:inline">


<button class="btn btn-danger btn-sm">

Rifiuta

</button>


</form>


</td>


</tr>


</tbody>


</table>


</div>

</body>

</html>
