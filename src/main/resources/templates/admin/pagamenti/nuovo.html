<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Nuovo pagamento</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>


<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>



<div class="container mt-5 pt-4">


<div class="card shadow">


<div class="card-header bg-primary text-white">

<h3>
Nuovo pagamento
</h3>

</div>


<div class="card-body">


<p>

Partecipante:

<strong>
<span th:text="${adesione.partecipante.nome}">
</span>

<span th:text="${adesione.partecipante.cognome}">
</span>
</strong>

</p>


<p>

Pellegrinaggio:

<strong th:text="${adesione.pellegrinaggio.nome}">
</strong>

</p>



<form th:action="@{/admin/pagamenti/salva}"
      method="post">


<input type="hidden"
       name="adesioneId"
       th:value="${adesione.id}">



<div class="mb-3">

<label class="form-label">
Tipo pagamento
</label>


<select class="form-select"
        name="tipoPagamento"
        required>


<option value="">
Seleziona
</option>


<option value="ANTICIPO">
Anticipo
</option>


<option value="SALDO">
Saldo
</option>


</select>

</div>





<div class="mb-3">

<label class="form-label">
Importo
</label>


<input type="number"
       step="0.01"
       class="form-control"
       name="importo"
       required>

</div>





<div class="mb-3">

<label class="form-label">
Causale
</label>


<input class="form-control"
       name="causale">

</div>





<div class="mb-3">

<label class="form-label">
Note
</label>


<textarea class="form-control"
          name="note">
</textarea>

</div>





<button class="btn btn-success">
Salva
</button>


<a class="btn btn-secondary"
   th:href="@{/admin/pagamenti/adesione/{id}(id=${adesione.id})}">
Annulla
</a>


</form>


</div>


</div>


</div>


</body>

</html>
