<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Modifica password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<!-- Contenuto -->
<div class="container mt-5 pt-4">

    <div class="card mx-auto"
         style="max-width: 500px;">

        <div class="card-header bg-danger text-white">

            <h4 class="mb-0">
                Modifica password
            </h4>

        </div>


        <div class="card-body">

            <!-- Username -->
            <div class="mb-3">

                <label class="form-label">
                    Utente
                </label>

                <input type="text"
                       class="form-control"
                       th:value="${utente.username}"
                       readonly>

            </div>


            <form method="post"
                  th:action="@{/admin/utenti/modifica-password/{id}(id=${utente.id})}">

                <!-- Nuova password -->
                <div class="mb-3">

                    <label for="password"
                           class="form-label">
                        Nuova password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Inserisci la nuova password"
                           required>

                </div>


                <!-- Conferma password -->
                <div class="mb-3">

                    <label for="confermaPassword"
                           class="form-label">
                        Conferma password
                    </label>

                    <input type="password"
                           id="confermaPassword"
                           name="confermaPassword"
                           class="form-control"
                           placeholder="Ripeti la nuova password"
                           required>

                </div>


                <!-- Messaggio errore -->
                <div th:if="${errore}"
                     class="alert alert-danger"
                     th:text="${errore}">
                </div>


                <!-- Messaggio successo -->
                <div th:if="${successo}"
                     class="alert alert-success"
                     th:text="${successo}">
                </div>


                <!-- Pulsanti -->
                <div class="d-flex justify-content-between mt-4">

                    <a th:href="@{/admin/utenti}"
                       class="btn btn-secondary">
                        Annulla
                    </a>


                    <button type="submit"
                            class="btn btn-danger">
                        Salva nuova password
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


</body>

</html>
