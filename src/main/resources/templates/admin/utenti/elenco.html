<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Utenti</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">

    <h2>
        Gestione utenti
    </h2>


    <table class="table table-striped">

        <thead class="table-dark">

        <tr>

            <th>Username</th>

            <th>Ruolo</th>

            <th>Stato</th>

            <th>Azioni</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="u : ${utenti}">

            <td th:text="${u.username}">
            </td>


            <td th:text="${u.ruolo}">
            </td>


            <td>

                <span th:if="${u.attivo}"
                      class="badge bg-success">
                    Attivo
                </span>

                <span th:unless="${u.attivo}"
                      class="badge bg-danger">
                    Disattivo
                </span>

            </td>


            <td>

                <!-- Modifica password -->
                <a class="btn btn-warning btn-sm"
                   th:href="@{/admin/utenti/modifica-password/{id}(id=${u.id})}">
                    Modifica password
                </a>


                <!-- Disabilita -->
                <a class="btn btn-danger btn-sm"
                   th:if="${u.attivo}"
                   th:href="@{/admin/utenti/disabilita/{id}(id=${u.id})}">
                    Disabilita
                </a>


                <!-- Abilita -->
                <a class="btn btn-success btn-sm"
                   th:unless="${u.attivo}"
                   th:href="@{/admin/utenti/abilita/{id}(id=${u.id})}">
                    Abilita
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
