<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuovo servizio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">


    <h2 class="mb-4">
        Nuovo servizio
    </h2>


    <p class="text-muted">

        Pellegrinaggio:

        <strong th:text="${pellegrinaggio.nome}">
        </strong>

    </p>


    <div class="card">

        <div class="card-body">


            <form method="post"
                  th:action="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle/{tabellaId}/servizi(
                      pellegrinaggioId=${pellegrinaggio.id},
                      tabellaId=${tabella.id}
                  )}">


                <div class="mb-3">

                    <label for="descrizione"
                           class="form-label">

                        Descrizione

                    </label>

                    <input type="text"
                           id="descrizione"
                           name="descrizione"
                           class="form-control"
                           required>

                </div>


               <a class="btn btn-secondary"
				   th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle(
				       pellegrinaggioId=${pellegrinaggio.id}
				   )}">

                    Annulla

                </a>


                <button type="submit"
                        class="btn btn-success">

                    Salva

                </button>


            </form>

        </div>

    </div>

</div>

<div class="card">

    <div class="card-header">
        <strong>Servizi presenti</strong>
    </div>

    <div class="card-body p-0">

        <div th:if="${#lists.isEmpty(servizi)}"
             class="p-4 text-muted">

            Nessun servizio presente.

        </div>

        <table th:unless="${#lists.isEmpty(servizi)}"
               class="table table-striped table-hover mb-0">

            <thead>
            <tr>

                <th style="width: 80px;">
                    #
                </th>

                <th>
                    Descrizione
                </th>

                <th style="width: 120px;">
                    Azioni
                </th>

            </tr>
            </thead>

            <tbody>

            <tr th:each="servizio, stat : ${servizi}">

                <td th:text="${stat.count}">
                </td>

                <td th:text="${servizio.descrizione}">
                </td>

                <td>

                    <form method="post"
                          th:action="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle/{tabellaId}/servizi/{servizioId}/elimina(
                              pellegrinaggioId=${pellegrinaggio.id},
                              tabellaId=${tabella.id},
                              servizioId=${servizio.id}
                          )}"
                          onsubmit="return confirm('Sei sicuro di voler eliminare questo servizio?');">

                        <button type="submit"
                                class="btn btn-sm btn-danger">

                            Elimina

                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>



</body>

</html>
