<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuova scelta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">

    <h2 class="mb-4">
        Gestione scelte
    </h2>


    <p class="text-muted">

        Pellegrinaggio:

        <strong th:text="${pellegrinaggio.nome}">
        </strong>

    </p>


    <p class="text-muted">

        Tabella:

        <strong th:text="${tabella.descrizione}">
        </strong>

    </p>


    <!-- =============================== -->
    <!-- NUOVA SCELTA -->
    <!-- =============================== -->

    <div class="card mb-4">

        <div class="card-header">

            <strong>
                Aggiungi nuova scelta
            </strong>

        </div>


        <div class="card-body">

            <form method="post"
                  th:action="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle/{tabellaId}/scelte(
                      pellegrinaggioId=${pellegrinaggio.id},
                      tabellaId=${tabella.id}
                  )}">


                <div class="mb-3">

                    <label for="descrizione"
                           class="form-label">

                        Descrizione

                    </label>


                    <input type="text"
                           id="descrizione"
                           name="descrizione"
                           class="form-control"
                           placeholder="Inserisci la scelta"
                           required>

                </div>


                <a class="btn btn-secondary"
                   th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle(
                       pellegrinaggioId=${pellegrinaggio.id}
                   )}">

                    Annulla

                </a>


                <button type="submit"
                        class="btn btn-success">

                    Aggiungi

                </button>


            </form>

        </div>

    </div>


    <!-- =============================== -->
    <!-- ELENCO SCELTE -->
    <!-- =============================== -->

    <div class="card">

        <div class="card-header">

            <strong>
                Scelte presenti
            </strong>

        </div>


        <div class="card-body p-0">


            <!-- NESSUNA SCELTA -->

            <div th:if="${#lists.isEmpty(scelte)}"
                 class="p-4 text-muted">

                Nessuna scelta presente.

            </div>


            <!-- ELENCO -->

            <table th:unless="${#lists.isEmpty(scelte)}"
                   class="table table-striped table-hover mb-0">

                <thead>

                <tr>

                    <th style="width: 80px;">
                        #
                    </th>

                    <th>
                        Descrizione
                    </th>

                    <th style="width: 120px;">
                        Azioni
                    </th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="sceltaElemento, stat : ${scelte}">

                    <td th:text="${stat.count}">
                    </td>


                    <td th:text="${sceltaElemento.descrizione}">
                    </td>


                    <td>

                        <form method="post"
                              th:action="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle/{tabellaId}/scelte/{sceltaId}/elimina(
                                  pellegrinaggioId=${pellegrinaggio.id},
                                  tabellaId=${tabella.id},
                                  sceltaId=${sceltaElemento.id}
                              )}"
                              onsubmit="return confirm('Sei sicuro di voler eliminare questa scelta?');">

                            <button type="submit"
                                    class="btn btn-sm btn-danger">

                                Elimina

                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
