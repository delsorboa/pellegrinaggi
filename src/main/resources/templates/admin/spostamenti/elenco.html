<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        Spostamenti
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">


    <!-- Intestazione -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>
                Spostamenti
            </h2>

            <h5 class="text-muted"
                th:text="${pellegrinaggio.nome}">
            </h5>

        </div>


        <a class="btn btn-success"
           th:href="@{/admin/pellegrinaggi/{id}/spostamenti/nuovo(id=${pellegrinaggio.id})}">

            + Nuovo spostamento

        </a>

    </div>


    <!-- Nessuno spostamento -->

    <div th:if="${#lists.isEmpty(spostamenti)}"
         class="alert alert-info">

        Nessuno spostamento inserito per questo pellegrinaggio.

    </div>


    <!-- Elenco spostamenti -->

    <div th:if="${!#lists.isEmpty(spostamenti)}"
         class="table-responsive">


        <table class="table table-striped table-hover align-middle">


            <thead class="table-dark">

            <tr>

                <th>
                    Tipo mezzo
                </th>

                <th>
                    Tipo viaggio
                </th>

                <th>
                    Data partenza
                </th>

                <th>
                    Data arrivo
                </th>

                <th>
                    Luogo partenza
                </th>

                <th>
                    Luogo arrivo
                </th>

                <th>
                    Note
                </th>

                <th>
                    Azioni
                </th>

            </tr>

            </thead>


            <tbody>


            <tr th:each="s : ${spostamenti}">


                <!-- Tipo mezzo -->

                <td th:text="${s.tipMezzo.descrizione}">
                </td>


                <!-- Tipo viaggio -->

                <td th:text="${s.tipViaggio.descrizione}">
                </td>


                <!-- Data partenza -->

                <td th:text="${#temporals.format(s.dataPartenza, 'dd/MM/yyyy')}">
                </td>


                <!-- Data arrivo -->

                <td th:text="${#temporals.format(s.dataArrivo, 'dd/MM/yyyy')}">
                </td>


                <!-- Luogo partenza -->

                <td th:text="${s.luogoPartenza}">
                </td>


                <!-- Luogo arrivo -->

                <td th:text="${s.luogoArrivo}">
                </td>


                <!-- Note -->

                <td th:text="${s.note}">
                </td>


                <!-- Azioni -->

                <td>

                    <div class="d-flex gap-2">


                        <!-- Modifica -->

                        <a class="btn btn-sm btn-warning"
                           th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/spostamenti/modifica/{id}
                           (pellegrinaggioId=${pellegrinaggio.id}, id=${s.id})}">

                            Modifica

                        </a>


                        <!-- Elimina -->

                        <a class="btn btn-sm btn-danger"
                           th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/spostamenti/elimina/{id}
                           (pellegrinaggioId=${pellegrinaggio.id}, id=${s.id})}"
                           onclick="return confirm('Sei sicuro di voler eliminare questo spostamento?');">

                            Elimina

                        </a>


                    </div>

                </td>


            </tr>


            </tbody>

        </table>

    </div>


    <!-- Torna al pellegrinaggio -->

    <div class="mt-4">

        <a class="btn btn-secondary"
           th:href="@{/admin/pellegrinaggi/modifica/{id}(id=${pellegrinaggio.id})}">

            ← Torna al pellegrinaggio

        </a>

    </div>


</div>


</body>

</html>
