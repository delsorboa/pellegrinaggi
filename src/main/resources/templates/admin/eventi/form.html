<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Evento</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<body>

	<div th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>

	<div class="container mt-5 pt-4">

		<h2 th:if="${evento.id == null}">Nuovo Evento</h2>

		<h2 th:unless="${evento.id == null}">Modifica Evento</h2>

		<form
			th:action="@{/admin/pellegrinaggi/{id}/eventi/salva(id=${pellegrinaggio.id})}"
			th:object="${evento}" method="post">

			<!-- 1. ID (Nascosto) -->
			<input type="hidden" th:field="*{id}">

			<!-- ID PELLEGRINAGGIO (Nascosto per non perderlo al salvataggio) -->
			<input type="hidden" th:field="*{idPellegrinaggio}">

			<!-- 2. DESCRIZIONE -->
			<div class="mb-3">
				<label class="form-label">Descrizione</label>
				<textarea class="form-control" rows="4" th:field="*{descrizione}"></textarea>
			</div>

			<!-- 6. ID_TIPO_EVENTO (Combo con ID e data-nome aggiunti per JS) -->
			<div class="mb-3">
				<label class="form-label">Tipo evento</label> <select
					class="form-select" id="comboTipoEvento"
					th:field="*{tipoEvento.id}" required>
					<option value="">-- Seleziona tipo evento --</option>
					<option th:each="tipo : ${tipiEvento}" th:value="${tipo.id}"
						th:data-nome="${tipo.descrizione.toLowerCase()}"
						th:text="${tipo.descrizione}"></option>
				</select>
			</div>

			<!-- 5. ID_TABELLA (Combo con ID aggiunto per JS) -->
			<div class="mb-3">
				<label class="form-label">Tabella</label> <select
					class="form-select" id="comboTabella" th:field="*{tabella.id}"
					required>
					<option value="">-- Seleziona tabella --</option>
					<option th:each="tabella : ${tabelle}" th:value="${tabella.id}"
						th:text="${tabella.descrizione}"></option>
				</select>
			</div>

			<!-- 3. MULTISELEZIONE -->
			<div class="mb-3">
				<div class="form-check">
					<input class="form-check-input" type="checkbox" id="multiselezione"
						th:field="*{multiselezione}"> <label
						class="form-check-label" for="multiselezione">
						Multiselezione </label>
				</div>
			</div>

			<!-- 4. NOTE -->
			<div class="mb-3">
				<label class="form-label">Note</label>
				<textarea class="form-control" rows="4" th:field="*{note}"></textarea>
			</div>

			<!-- 7. ID_EVENTO (Combo - Ricorsiva / Non obbligatoria) -->
			<div class="mb-3">
				<label class="form-label">Evento Correlato (Padre)</label> <select
					class="form-select" th:field="*{eventoPadre.id}">
					<option value="">-- Nessun evento correlato --</option>
					<option th:each="ev : ${tuttiEventi}" th:if="${ev.id != evento.id}"
						th:value="${ev.id}" th:text="${ev.descrizione}"></option>
				</select>
			</div>

			<!-- PULSANTI -->
			<button type="submit" class="btn btn-success">Salva</button>
			<a class="btn btn-secondary"
				th:href="@{/admin/pellegrinaggi/{id}/eventi(id=${pellegrinaggio.id})}">Annulla</a>

		</form>
	</div>

<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function () {

    const comboTipoEvento = document.getElementById("comboTipoEvento");
    const comboTabella = document.getElementById("comboTabella");
    const checkboxMultiselezione = document.getElementById("multiselezione");

    // Salva tutte le tabelle generate da Thymeleaf (escludendo il placeholder vuoto)
    const tutteLeOpzioniTabella = Array.from(comboTabella.options)
        .filter(option => option.value !== "")
        .map(function (option) {
            return {
                value: option.value,
                text: option.text
            };
        });

    // Valore della tabella già associata all'evento (passato in sicurezza da Thymeleaf)
    const idTabellaIniziale = /*[[${evento.tabella != null ? evento.tabella.id : null}]]*/ null;

    // Flag per capire se l'esecuzione è quella dell'avvio pagina
    let isInizializzazione = true;

    function aggiornaComboTabella() {

        const opzioneTipo = comboTipoEvento.options[comboTipoEvento.selectedIndex];
        const nomeTipo = opzioneTipo ? (opzioneTipo.getAttribute("data-nome") || "").toLowerCase() : "";

        // Al primo avvio prendiamo forzatamente l'ID da Thymeleaf, ai successivi cambi prendiamo il valore della select
        const valoreTabella = isInizializzazione ? idTabellaIniziale : comboTabella.value;


        // ==========================================================
        // MULTISELEZIONE
        // ==========================================================

        if (nomeTipo.includes("unico")) {
            checkboxMultiselezione.checked = false;
            checkboxMultiselezione.disabled = true;
        } else {
            checkboxMultiselezione.disabled = false;
        }


        // ==========================================================
        // SVUOTA COMBO
        // ==========================================================

        comboTabella.innerHTML = '<option value="">-- Seleziona tabella --</option>';

        if (!nomeTipo) {
            // Spegniamo il flag anche in caso di uscita anticipata
            isInizializzazione = false;
            return;
        }


        // ==========================================================
        // TIPO UNICO
        // ==========================================================

        if (nomeTipo.includes("unico")) {
            tutteLeOpzioniTabella.forEach(function (tabella) {
                if (tabella.text.toLowerCase().includes("scelta")) {
                    const option = document.createElement("option");
                    option.value = tabella.value;
                    option.text = tabella.text;
                    option.selected = true;
                    comboTabella.appendChild(option);
                }
            });

            isInizializzazione = false;
            return;
        }


        // ==========================================================
        // TIPO CONTENITORE
        // ==========================================================

        if (nomeTipo.includes("contenitore")) {
            tutteLeOpzioniTabella.forEach(function (tabella) {
                const descrizione = tabella.text.toLowerCase();

                if (descrizione.includes("servizi") || descrizione.includes("partecipante")) {
                    const option = document.createElement("option");
                    option.value = tabella.value;
                    option.text = tabella.text;

                    // Confronto sicuro convertendo entrambi i valori in stringa
                    if (valoreTabella !== null && String(tabella.value) === String(valoreTabella)) {
                        option.selected = true;
                    }

                    comboTabella.appendChild(option);
                }
            });

            isInizializzazione = false;
            return;
        }


        // ==========================================================
        // ALTRI TIPI
        // ==========================================================

        tutteLeOpzioniTabella.forEach(function (tabella) {
            const option = document.createElement("option");
            option.value = tabella.value;
            option.text = tabella.text;

            if (valoreTabella !== null && String(tabella.value) === String(valoreTabella)) {
                option.selected = true;
            }

            comboTabella.appendChild(option);
        });

        // Spegniamo il flag al termine del primo ciclo completo
        isInizializzazione = false;
    }


    // Quando cambia il tipo evento
    comboTipoEvento.addEventListener("change", aggiornaComboTabella);

    // Inizializzazione al caricamento della pagina
    aggiornaComboTabella();

});
</script>



</body>
</html>
