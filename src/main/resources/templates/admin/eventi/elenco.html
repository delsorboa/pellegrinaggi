<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Eventi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet"
      th:href="@{/css/custom.css}">

</head>


<body>

<div th:replace="~{fragments/navbar-admin :: navbar-admin}">
</div>


<div class="container mt-5 pt-4">


    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>
                Eventi del pellegrinaggio
            </h2>

            <p class="text-muted mb-0">

                <strong th:text="${pellegrinaggio.nome}">
                </strong>

            </p>

        </div>


        <a class="btn btn-success"
           th:href="@{/admin/pellegrinaggi/{id}/eventi/nuovo(id=${pellegrinaggio.id})}">

            + Nuovo evento

        </a>

    </div>


    <div th:if="${#lists.isEmpty(eventi)}"
         class="alert alert-info">

        Nessun evento inserito per questo pellegrinaggio.

    </div>


    <div th:unless="${#lists.isEmpty(eventi)}"
         class="table-responsive">


        <table class="table table-striped table-bordered align-middle">


            <thead class="table-dark">

            <tr>

                <th>
                    Tipo evento
                </th>

                <th>
                    Descrizione
                </th>

                <th>
                    Note
                </th>

                <th>
                   Tabella
                </th>

                <th style="width: 180px;">
                    Azioni
                </th>

            </tr>

            </thead>


            <tbody>


            <tr th:each="evento : ${eventi}">


                <td>

                    <span th:each="tipo : ${tipiEvento}"
                          th:if="${tipo.id == evento.tipoEvento.id}"
                          th:text="${tipo.descrizione}">
                    </span>

                </td>


                <td th:text="${evento.descrizione}">
                </td>


                <td th:text="${evento.note}">
                </td>


               <td>

				    <span th:each="tabella : ${tabelle}"
				          th:if="${tabella.id == evento.tabella.id}"
				          th:text="${tabella.descrizione}">
				    </span>
				
				</td>



                <td>

                    <a class="btn btn-sm btn-warning"
                       th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/eventi/modifica/{id}
                                (pellegrinaggioId=${pellegrinaggio.id},
                                 id=${evento.id})}">

                        Modifica

                    </a>


                    <a class="btn btn-sm btn-danger"
                       th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/eventi/elimina/{id}
                                (pellegrinaggioId=${pellegrinaggio.id},
                                 id=${evento.id})}"
                       onclick="return confirm('Sei sicuro di voler eliminare questo evento?');">

                        Elimina

                    </a>

                </td>


            </tr>


            </tbody>

        </table>


    </div>


    <div class="mt-3">
		
		<a class="btn btn-primary"
		   th:href="@{/admin/pellegrinaggi/{pellegrinaggioId}/tabelle(
		       pellegrinaggioId=${pellegrinaggio.id}
		   )}">
		
		    ⚙ Gestione tabelle
		
		</a>

        <a class="btn btn-secondary"
           th:href="@{/admin/pellegrinaggi/modifica/{id}(id=${pellegrinaggio.id})}">

            ← Torna al pellegrinaggio

        </a>

    </div>


</div>

</body>

</html>
